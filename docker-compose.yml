services:

  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: library_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./library_db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: library-backend
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: library_db
      PORT: 5000
      JWT_SECRET: library_management_secret_2026_change_this

    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: library-frontend
    restart: always

    depends_on:
      backend:
        condition: service_started

    ports:
      - "3000:3000"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: cadvisor

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    privileged: true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - cadvisor

    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3001:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  mysql_data:
  grafana-data: